[build]
  publish = "public"
  functions = "netlify/functions"
  # On every deploy: (1) rebuild the app's data from the CSV files in data-source/
  # (stopping, with a clear message in the deploy log, if a file is damaged — the
  # site then keeps running its previous version), and (2) give the service worker
  # a new version number so browsers drop their old cached copy. See
  # scripts/build-data.mjs and scripts/stamp-sw.mjs.
  command = "node scripts/build-data.mjs && node scripts/build-bible.mjs && node scripts/build-reading.mjs && node scripts/build-mixed.mjs && node scripts/stamp-sw.mjs"

# Only the "public" folder is served as static content. Everything the
# app needs to run lives inside it (index.html, css/, js/, icons/,
# manifest, service worker). The datasets (netlify/functions/data/) and
# the sync/get-data functions live outside "public" entirely — there is
# no URL that serves them directly; they're only reachable through the
# Identity-protected Netlify Functions (see netlify/functions/get-data.js
# and sync.js), which read them from inside their own function bundle,
# not from anything the CDN publishes.
#
# The front end itself has no build step (it's plain files); the build command
# above only prepares the data and the service worker's version number.

[[headers]]
  for = "/sw.js"
  [headers.values]
    # The service worker itself must never be cached, or browsers won't
    # pick up a new CACHE_VERSION (and thus won't pick up app updates).
    Cache-Control = "no-cache"
